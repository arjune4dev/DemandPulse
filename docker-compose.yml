
services:
  api:
    build: .
    container_name: demandpulse-api
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    environment:
      PYTHONPATH: /app
    restart: unless-stopped

  dashboard:
    build: .
    container_name: demandpulse-dashboard
    command: >
      streamlit run dashboard.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    environment:
      PYTHONPATH: /app
    depends_on:
      - api
    restart: unless-stopped
